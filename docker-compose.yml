name: siplug-dubber

services:
  app:
    build:
      context: .
      dockerfile: ./.docker/python/Dockerfile.DEV
    working_dir: /var/www/html
    init: true
    ports:
      - "127.0.0.1:${DUBBER_HTTP_PORT:-8087}:8000"
    environment:
      DUBBER_APP_NAME: SiPlug Dubber API
      DUBBER_ENVIRONMENT: local
      DUBBER_DB_HOST: db
      DUBBER_DB_PORT: 3306
      DUBBER_DB_DATABASE: siplug_dubber
      DUBBER_DB_USERNAME: siplug_dubber
      DUBBER_DB_PASSWORD: ${DUBBER_DB_PASSWORD:?Configure DUBBER_DB_PASSWORD no .env}
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      local:
      rede_internal:
        aliases: [siplug-dubber-api]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siplug_dubber
      MYSQL_USER: siplug_dubber
      MYSQL_PASSWORD: ${DUBBER_DB_PASSWORD:?Configure DUBBER_DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DUBBER_DB_ROOT_PASSWORD:?Configure DUBBER_DB_ROOT_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DUBBER_DB_PORT:-3323}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [local]

volumes:
  mysql_data:

networks:
  local:
  rede_internal:
    external: true
